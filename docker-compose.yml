volumes:
  postgres: {}
  redis-jobs: {}
  mailpit: {}

services:
  postgres:
    restart: unless-stopped
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: greenhill
      POSTGRES_PASSWORD: greenhill
      POSTGRES_DB: greenhill_development
    volumes:
      - postgres:/var/lib/postgresql

  # Backs Sidekiq + Flipper — both need noeviction so a queued job or a
  # flag's state never silently disappears under memory pressure.
  redis-jobs:
    restart: unless-stopped
    image: redis:8-alpine
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-jobs:/data

  # Backs Rails.cache only — disposable/recomputable data, so it's safe to
  # evict under memory pressure and skip persistence entirely.
  redis-cache:
    restart: unless-stopped
    image: redis:8-alpine
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 256mb
    ports:
      - "6380:6379"

  # Catches all mail sent in development (SMTP on 1025) and shows it in a web
  # UI at http://localhost:8025. Messages persist across restarts in the volume.
  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit:/data
