AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - "db/**/*"
    - "config/**/*"
    - "bin/{rails,rake,vite}"
    - "vendor/**/*"

plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-graphql

# ActiveAdmin's `register` DSL is one long block per resource by design
# (index/filter/show/form all live inside it).
Metrics/BlockLength:
  Exclude:
    - "app/admin/**/*"

# A multi-line hash/array/heredoc literal is one piece of data, not several
# statements — count it as a single line in methods and examples.
Metrics/MethodLength:
  CountAsOne: ["array", "hash", "heredoc"]
RSpec/ExampleLength:
  CountAsOne: ["array", "hash", "heredoc"]

# Per-class/module doc comments aren't our house style (see root CLAUDE.md).
Style/Documentation:
  Enabled: false

# Prefer double quotes even for non-interpolated strings, to avoid awkward
# backslash-escaping (e.g. an apostrophe in a plain string).
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Our mutations inherit from GraphQL::Schema::RelayClassicMutation, which
# already auto-generates a named input type per mutation (e.g.
# UpdatePasswordInput) — the extracted input type this cop wants already
# exists, just generated for us rather than hand-declared.
GraphQL/ExtractInputType:
  Enabled: false

# We deliberately keep each field next to its resolver method (or inline
# resolver block), not grouped into a separate "fields" section — matches
# how mutations in this repo are structured too.
GraphQL/FieldDefinitions:
  Enabled: false
