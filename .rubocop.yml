AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - "db/**/*"
    - "config/**/*"
    - "bin/{rails,rake}"
    - "vendor/**/*"

plugins:
  - rubocop-rails
  - rubocop-rspec

# Per-class/module doc comments aren't our house style (see root CLAUDE.md).
Style/Documentation:
  Enabled: false
